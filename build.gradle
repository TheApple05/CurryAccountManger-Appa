plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

layout.buildDirectory = file("build/${minecraft_version}")

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files('libs/waybackauthlib-1.1.0.jar')
}

processResources {
    inputs.properties version: project.version, minecraft_version: minecraft_version, fabric_api_version: fabric_api_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: minecraft_version, fabric_api_version: fabric_api_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE')
    from('libs/waybackauthlib-1.1.0.jar') { into 'META-INF/jars' }
}

sourceSets {
    main.java.srcDir("src/${minecraft_version}/java")
    qa {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('qaJar', Jar) {
    archiveClassifier = 'qa'
    from sourceSets.qa.output
}

// Compatibility alias: Minecraft 26.x ships unobfuscated, so no remapping occurs.
tasks.register('remapQaJar') {
    dependsOn tasks.named('qaJar')
}

// Credential tests use an injected transport and synthetic values only.
tasks.register('tokenRefresherTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'autismclient.util.tokenimport.TokenRefresherTest'
}

tasks.register('tokenImportTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'autismclient.util.tokenimport.TokenImportServiceTest'
}

tasks.register('credentialEncryptionTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'autismclient.util.mm.crypto.AtRestSealTest'
}

tasks.named('check') {
    dependsOn tasks.named('tokenRefresherTest'), tasks.named('tokenImportTest'), tasks.named('credentialEncryptionTest')
}

tasks.named('test') {
    // These suites have explicit main entrypoints and fail through their JavaExec tasks.
    failOnNoDiscoveredTests = false
    dependsOn tasks.named('tokenRefresherTest'), tasks.named('tokenImportTest'), tasks.named('credentialEncryptionTest')
}
