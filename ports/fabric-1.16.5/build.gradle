plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
base { archivesName = 'curryfarts' }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
jar { from('LICENSE') }
tasks.named('remapJar') { archiveClassifier = 'fabric' }

sourceSets { qa { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath } }
tasks.register('qaJar', Jar) { archiveClassifier = 'qa-dev'; from sourceSets.qa.output }
tasks.register('remapQaJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('qaJar')
    inputFile = tasks.named('qaJar').flatMap { it.archiveFile }
    archiveClassifier = 'qa'
    sourceNamespace = 'named'
    targetNamespace = 'intermediary'
    classpath.from(sourceSets.qa.compileClasspath)
}

// Deterministic Java 8 protocol/parser/lifecycle checks. No credentials or network.
tasks.register('tokenImportTest', JavaExec) {
 dependsOn tasks.named('testClasses')
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'curryfarts.legacy.TokenImporterTest'
 if (System.getenv('JAVA8_HOME')) executable = new File(System.getenv('JAVA8_HOME'), 'bin/java.exe').absolutePath
}
tasks.named('check') { dependsOn tasks.named('tokenImportTest') }

// Tests are standalone Java mains executed by tokenImportTest.
tasks.named("test") { enabled = false }

tasks.register("exportQaClasspath") { dependsOn tasks.named("qaClasses"); doLast { file(".tools").mkdirs(); file(".tools/qa-classpath.txt").text = sourceSets.qa.runtimeClasspath.asPath } }
